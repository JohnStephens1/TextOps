[project]
name = "text-ops"
version = "0.1.0"
description = "A practical MLOps demonstration project for building and managing a text classification system in a production-like environment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    "dvc>=3.67.1",
    "mlflow==3.14",
    "numpy>=2.5.1",
    "pandas>=2,<3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sentence-transformers>=5.6.0",
    "tensorflow>=2.21.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_classifier"]

[tool.uv.sources]
common = { workspace = true }

[tool.uv.workspace]
members = [
    "api",
    "app",
    "common",
]
