services:
  app:
    build:
      context: .
      target: base

    working_dir: /app

    ports:
      - "${GRADIO_SERVER_PORT}:7860"

    environment:
      API_URL: http://api:8000
      GRADIO_SERVER_NAME: "${GRADIO_SERVER_NAME}"
      GRADIO_SERVER_PORT: "${GRADIO_SERVER_PORT}"

    depends_on:
      - api
      - mlflow

    command:
      - uv
      - run
      - --package
      - app
      - python
      - -m
      - app.app


  api:
    build:
      context: .
      target: base

    working_dir: /app

    ports:
      - "8000:8000"

    environment:
      MLFLOW_URL: http://mlflow:5000

    volumes:
      - ./mlruns:/app/mlruns

    depends_on:
      - mlflow

    command:
      - uv
      - run
      - --package
      - api
      - uvicorn
      - api.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"


  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/mlruns/mlflow.db

    ports:
      - "5000:5000"

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "${MLFLOW_SERVER_ALLOWED_HOSTS}"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS}"

    volumes:
      - ./mlruns:/app/mlruns


  train-pipe:
    profiles: ["train-pipe"]

    working_dir: /app

    build:
      context: .
      target: train

    environment:
      MLFLOW_URL: http://mlflow:5000

    volumes:
      - ./.dvc:/app/.dvc
      - ./.git:/app/.git
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./dvc.lock:/app/dvc.lock
      - ./params.yaml:/app/params.yaml

    depends_on:
      - mlflow

    entrypoint:
      - uv
      - run
      - dvc
      - repro


  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    working_dir: /app
    volumes:
      - .:/app
    command: sleep infinity
