services:
  # app
  # api
  # mlflow
  # train

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/mlruns/mlflow.db

    ports:
      - "5000:5000"

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS}

    volumes:
      - ./mlruns:/app/mlruns


